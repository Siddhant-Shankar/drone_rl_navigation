agent:
  algorithm: "TD3"
  state_dim: 9
  action_dim: 3
  hidden_dim: 256

  # Training hyperparameters
  gamma: 0.99 # Discount factor
  tau: 0.005 # Soft update rate
  batch_size: 256
  replay_buffer_size: 100000

  # Exploration
  initial_noise: 0.5
  final_noise: 0.1
  noise_decay: 0.995
  policy_noise: 0.2
  noise_clip: 0.5

  # Update frequency
  policy_delay: 2
  actor_lr: 0.001
  critic_lr: 0.001

environment:
  # Workspace bounds
  bounds:
    x_min: -10.0
    x_max: 10.0
    y_min: -10.0
    y_max: 10.0
    z_min: 0.0
    z_max: 10.0

  # Physical parameters
  mass: 1.5 # kg
  drag_coeff: 0.1
  max_velocity: 5.0 # m/s
  max_thrust: 15.0 # N
  dt: 0.1 # time step (seconds)

  # Goal parameters
  goal_threshold: 0.5 # meters
  default_goal: [8.0, 8.0, 5.0]

  # Obstacles
  num_obstacles: 5
  obstacle_radius_range: [0.5, 1.5]

  # Rewards
  goal_reward: 100.0
  collision_penalty: -100.0
  step_penalty: -0.1
  distance_weight: -0.01

training:
  num_episodes: 500
  max_steps_per_episode: 1000
  save_frequency: 50
  eval_frequency: 10

  # Early stopping
  target_success_rate: 0.8
  patience: 50
